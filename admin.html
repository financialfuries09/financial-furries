<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Article Admin</title><link rel='stylesheet' href='style.css'></head><body><main class='admin'><header><div><p class='eyebrow'>FINANCIAL FURRIES</p><h1>Article Admin</h1></div><a href='index.html'>← View website</a></header><section class='panel'><h2 id='titleForm'>Publish a new article</h2><p class='muted'>Write and publish articles without editing code.</p><form id='form'><input type='hidden' id='id'><label>Title *</label><input id='title' required><div class='two'><div><label>Category</label><select id='category'><option>Markets</option><option>Money</option><option>Business</option><option>Investing</option><option>Technology</option><option>World</option><option>Opinion</option></select></div><div><label>Author</label><input id='author'></div></div><label>Cover image URL</label><input id='image' placeholder='https://...'><label>Short description</label><textarea id='excerpt' rows='3'></textarea><label>Article *</label><textarea id='content' rows='14' required></textarea><div class='actions'><button class='button'>Publish article</button><button type='button' class='ghost' onclick='resetForm()'>Clear</button></div><p id='status' class='status'></p></form></section><section class='panel'><h2>Your articles</h2><div id='list'></div></section></main><script src='admin.js'></script></body></html>
