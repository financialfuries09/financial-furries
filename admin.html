<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Financial Furries Admin</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0d12;
  color:#fff;
  padding:20px;
}
.container{
  max-width:800px;
  margin:auto;
}
h1{margin-bottom:8px}
.subtitle{opacity:.65;margin-bottom:25px}
label{
  display:block;
  margin:16px 0 7px;
  font-weight:bold;
}
input,textarea,select{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border-radius:10px;
  border:1px solid #333;
  background:#151821;
  color:#fff;
  font-size:16px;
}
textarea{
  min-height:180px;
  resize:vertical;
}
button{
  margin-top:18px;
  padding:13px 20px;
  border:0;
  border-radius:10px;
  background:#f5c542;
  color:#111;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
.article{
  margin-top:25px;
  padding:18px;
  border:1px solid #333;
  border-radius:14px;
  background:#11141b;
}
.article h3{margin-top:0}
.delete{
  background:#d9534f;
  color:#fff;
}
.notice{
  margin-top:20px;
  padding:14px;
  border-radius:10px;
  background:#151821;
  border:1px solid #333;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>🦊 Financial Furries Admin</h1>

<div class="subtitle">
Publish and manage your Financial Furries articles.
</div>

<div class="notice">
<strong>Simple publishing mode</strong><br>
No GitHub token or connection is required.
Articles are saved in this browser.
</div>

<label>Article title</label>
<input id="title" placeholder="Enter article title">

<label>Category</label>
<select id="category">
<option>Money</option>
<option>Investing</option>
<option>Markets</option>
<option>Personal Finance</option>
<option>Business</option>
<option>Economy</option>
<option>Learn</option>
</select>

<label>Short description</label>
<textarea id="excerpt" style="min-height:100px"
placeholder="Write a short description"></textarea>

<label>Article content</label>
<textarea id="content"
placeholder="Write your full article here"></textarea>

<button onclick="publishArticle()">Publish Article</button>

<div id="message"></div>

<h2 style="margin-top:40px">Published Articles</h2>

<div id="articles"></div>

</div>

<script>

const KEY="financialFurriesArticles";

function getArticles(){
  try{
    return JSON.parse(localStorage.getItem(KEY)||"[]");
  }catch(e){
    return [];
  }
}

function saveArticles(articles){
  localStorage.setItem(KEY,JSON.stringify(articles));
}

function publishArticle(){

  const title=document.getElementById("title").value.trim();
  const category=document.getElementById("category").value;
  const excerpt=document.getElementById("excerpt").value.trim();
  const content=document.getElementById("content").value.trim();
  const message=document.getElementById("message");

  if(!title||!excerpt||!content){
    message.innerHTML=
      '<div class="notice">Please fill in the title, description and article.</div>';
    return;
  }

  const articles=getArticles();

  articles.push({
    id:Date.now(),
    title,
    category,
    excerpt,
    content,
    date:new Date().toLocaleDateString()
  });

  saveArticles(articles);

  document.getElementById("title").value="";
  document.getElementById("excerpt").value="";
  document.getElementById("content").value="";

  message.innerHTML=
    '<div class="notice">✅ Article published successfully on this browser.</div>';

  render();
}

function deleteArticle(id){

  const articles=getArticles()
    .filter(article=>article.id!==id);

  saveArticles(articles);
  render();
}

function render(){

  const box=document.getElementById("articles");
  const articles=getArticles();

  if(!articles.length){
    box.innerHTML='<p style="opacity:.6">No articles published yet.</p>';
    return;
  }

  box.innerHTML=articles.slice().reverse().map(article=>`

    <div class="article">

      <small style="opacity:.6">
        ${escapeHTML(article.category)} · ${escapeHTML(article.date)}
      </small>

      <h3>${escapeHTML(article.title)}</h3>

      <p style="opacity:.75">
        ${escapeHTML(article.excerpt)}
      </p>

      <button
        class="delete"
        onclick="deleteArticle(${article.id})">
        Delete
      </button>

    </div>

  `).join("");
}

function escapeHTML(value){

  return String(value).replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c];
  });

}

render();

</script>

</body>
</html>
